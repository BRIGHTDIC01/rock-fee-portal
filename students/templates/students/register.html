<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Student Registration | Rock Foundation
    </title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #222;
        }

        .container {
            max-width: 650px;
            margin: 40px auto;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin-top: 0;
            text-align: center;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #111;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            border: none;
            border-radius: 7px;
            background: #111;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        .message {
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 7px;
            background: #ffe5e5;
            color: #a00000;
        }

        .required {
            color: red;
        }

    </style>

</head>


<body>


<div class="container">

    <div class="card">


        <h1>
            Rock Foundation
        </h1>


        <p class="subtitle">
            Student Registration
        </p>


        <!-- ==================================================
             DJANGO MESSAGES
        =================================================== -->

        {% if messages %}

            {% for message in messages %}

                <div class="message">

                    {{ message }}

                </div>

            {% endfor %}

        {% endif %}


        <!-- ==================================================
             REGISTRATION FORM
        =================================================== -->

        <form
            method="POST"
            action=""
        >

            {% csrf_token %}


            <!-- STUDENT NAME -->

            <label for="full_name">

                Student Full Name

                <span class="required">
                    *
                </span>

            </label>


            <input
                type="text"
                id="full_name"
                name="full_name"
                placeholder="Enter student's full name"
                autocomplete="name"
                required
            >


            <!-- CLASS -->

            <label for="student_class">

                Class

                <span class="required">
                    *
                </span>

            </label>


            <select
                id="student_class"
                name="student_class"
                required
            >

                <option value="">
                    Select class
                </option>

                <option value="Primary 1">
                    Primary 1
                </option>

                <option value="Primary 2">
                    Primary 2
                </option>

                <option value="Primary 3">
                    Primary 3
                </option>

                <option value="Primary 4">
                    Primary 4
                </option>

                <option value="Primary 5">
                    Primary 5
                </option>

                <option value="JSS 1">
                    JSS 1
                </option>

                <option value="JSS 2">
                    JSS 2
                </option>

                <option value="JSS 3">
                    JSS 3
                </option>

                <option value="SSS 1">
                    SSS 1
                </option>

                <option value="SSS 2">
                    SSS 2
                </option>

                <option value="SSS 3">
                    SSS 3
                </option>

            </select>


            <!-- PARENT NAME -->

            <label for="parent_name">

                Parent / Guardian Name

                <span class="required">
                    *
                </span>

            </label>


            <input
                type="text"
                id="parent_name"
                name="parent_name"
                placeholder="Enter parent/guardian name"
                autocomplete="name"
                required
            >


            <!-- PARENT PHONE -->

            <label for="parent_phone">

                Parent Phone Number

                <span class="required">
                    *
                </span>

            </label>


            <input
                type="tel"
                id="parent_phone"
                name="parent_phone"
                placeholder="08012345678"
                autocomplete="tel"
                required
            >


            <!-- PARENT EMAIL -->

            <label for="parent_email">

                Parent Email

                <span class="required">
                    *
                </span>

            </label>


            <input
                type="email"
                id="parent_email"
                name="parent_email"
                placeholder="parent@example.com"
                autocomplete="email"
                required
            >


            <!-- SUBMIT -->

            <button type="submit">

                Register Student

            </button>


        </form>


    </div>

</div>


</body>

</html>
