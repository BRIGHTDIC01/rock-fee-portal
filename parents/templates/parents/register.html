<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Create Account | Rock Foundation</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #fff7ed,
                    #ffffff
                );

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 25px;
        }

        .card {
            width: 100%;
            max-width: 480px;

            background: white;

            padding: 38px;

            border-radius: 24px;

            box-shadow:
                0 20px 60px
                rgba(0,0,0,0.10);

            animation:
                enter 0.7s ease;
        }

        @keyframes enter {

            from {
                opacity: 0;
                transform:
                    translateY(25px)
                    scale(0.97);
            }

            to {
                opacity: 1;
                transform:
                    translateY(0)
                    scale(1);
            }

        }

        .logo {
            width: 58px;
            height: 58px;

            margin: 0 auto 18px;

            border-radius: 17px;

            background:
                linear-gradient(
                    135deg,
                    #f97316,
                    #ea580c
                );

            color: white;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 25px;
            font-weight: 900;

            box-shadow:
                0 10px 25px
                rgba(249,115,22,0.25);
        }

        h1 {
            margin: 0;

            text-align: center;

            color: #171717;

            font-size: 28px;
        }

        .subtitle {
            text-align: center;

            color: #737373;

            font-size: 14px;

            margin:
                8px 0 28px;
        }

        label {
            display: block;

            margin:
                16px 0 7px;

            font-size: 13px;

            font-weight: 800;

            color: #262626;
        }

        input {
            width: 100%;

            padding: 13px 14px;

            border:
                1px solid #e5e5e5;

            border-radius: 10px;

            font-size: 15px;

            outline: none;

            transition: 0.2s;
        }

        input:focus {
            border-color: #f97316;

            box-shadow:
                0 0 0 3px
                rgba(249,115,22,0.10);
        }

        .button {
            width: 100%;

            border: none;

            margin-top: 25px;

            padding: 15px;

            border-radius: 11px;

            background:
                linear-gradient(
                    135deg,
                    #f97316,
                    #ea580c
                );

            color: white;

            font-size: 15px;

            font-weight: 900;

            cursor: pointer;

            transition: 0.2s;
        }

        .button:hover {
            transform: translateY(-2px);

            box-shadow:
                0 10px 25px
                rgba(249,115,22,0.25);
        }

        .message {
            padding: 12px;

            margin-bottom: 15px;

            border-radius: 10px;

            background: #fef2f2;

            color: #991b1b;

            font-size: 13px;
        }

        .login-link {
            text-align: center;

            margin-top: 22px;

            font-size: 13px;

            color: #737373;
        }

        .login-link a {
            color: #ea580c;

            font-weight: 800;

            text-decoration: none;
        }

    </style>

</head>


<body>

<div class="card">

    <div class="logo">
        R
    </div>

    <h1>
        Create Parent Account
    </h1>

    <p class="subtitle">
        Create your Rock Foundation fee portal account
    </p>


    {% if messages %}

        {% for message in messages %}

            <div class="message">
                {{ message }}
            </div>

        {% endfor %}

    {% endif %}


    <form method="POST">

        {% csrf_token %}


        <label>
            Full Name
        </label>

        <input
            type="text"
            name="full_name"
            placeholder="Enter your full name"
            required
        >


        <label>
            Phone Number
        </label>

        <input
            type="tel"
            name="phone"
            placeholder="08012345678"
            required
        >


        <label>
            Email Address
        </label>

        <input
            type="email"
            name="email"
            placeholder="you@example.com"
            required
        >


        <label>
            Username
        </label>

        <input
            type="text"
            name="username"
            placeholder="Choose a username"
            required
        >


        <label>
            Password
        </label>

        <input
            type="password"
            name="password"
            placeholder="Create a password"
            required
        >


        <label>
            Confirm Password
        </label>

        <input
            type="password"
            name="confirm_password"
            placeholder="Confirm your password"
            required
        >


        <button
            type="submit"
            class="button"
        >
            Create Account
        </button>

    </form>


    <div class="login-link">

        Already have an account?

        <a href="{% url 'parent_login' %}">
            Login here
        </a>

    </div>

</div>


</body>

</html>
