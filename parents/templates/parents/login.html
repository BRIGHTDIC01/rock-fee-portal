<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Parent Login | Rock Foundation</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            width: 90%;
            max-width: 430px;
            background: white;
            padding: 35px;
            border-radius: 14px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 5px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-top: 15px;
            margin-bottom: 7px;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        .password-container {
            position: relative;
        }

        .password-container input {
            padding-right: 50px;
        }

        .eye-button {
            position: absolute;
            right: 5px;
            top: 5px;
            width: 42px;
            height: 42px;
            margin: 0;
            padding: 0;
            border: none;
            background: transparent;
            color: #111827;
            font-size: 19px;
            cursor: pointer;
        }

        .login-button {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #111827;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .login-button:hover {
            background: #1f2937;
        }

        .message {
            background: #fee2e2;
            color: #991b1b;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
        }
    </style>
</head>

<body>

<div class="login-card">

    <h1>Rock Foundation</h1>

    <p class="subtitle">
        Parent Portal
    </p>

    {% if messages %}
        {% for message in messages %}
            <div class="message">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}

    <form method="POST">

        {% csrf_token %}

        <label for="username">
            Username
        </label>

        <input
            type="text"
            id="username"
            name="username"
            placeholder="Enter your username"
            required
        >

        <label for="password">
            Password
        </label>

        <div class="password-container">

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                required
            >

            <button
                type="button"
                class="eye-button"
                onclick="togglePassword()"
                aria-label="Show password"
            >
                👁️
            </button>

        </div>

        <button
            type="submit"
            class="login-button"
        >
            Login
        </button>

        <div style="
    text-align:center;
    margin-top:22px;
    padding-top:20px;
    border-top:1px solid #eeeeee;
">

    <p style="
        margin:0 0 10px;
        color:#737373;
        font-size:13px;
    ">
        Don't have a parent account?
    </p>

    <a
        href="{% url 'parent_register' %}"
        style="
            display:inline-block;
            text-decoration:none;
            color:#ea580c;
            font-weight:800;
            font-size:14px;
        "
    >
        Create Parent Account →
    </a>

</div>

    </form>

</div>

<script>
function togglePassword() {
    const password = document.getElementById("password");
    const eye = document.querySelector(".eye-button");

    if (password.type === "password") {
        password.type = "text";
        eye.textContent = "🙈";
    } else {
        password.type = "password";
        eye.textContent = "👁️";
    }
}
</script>

</body>
</html>
